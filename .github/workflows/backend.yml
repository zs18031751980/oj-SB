name: backend

on:
  push:
    paths:
      - "webapi/oj-backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "webapi/oj-backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapi/oj-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: mvn -B -DskipTests=false test
      - name: Package
        run: mvn -B -DskipTests package
